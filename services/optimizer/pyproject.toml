[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduler-optimizer"
version = "0.1.0"
description = "Motor CP-SAT para generar alternativas de horarios universitarios"
requires-python = ">=3.10"
dependencies = ["ortools>=9.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18"]

[project.scripts]
scheduler-optimizer = "scheduler_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
