name: E2E
on:
  push:
    branches: [main]
  pull_request:

jobs:
  full-stack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: npm ci
      - name: Construir API y paquetes compartidos
        run: |
          npm run build -w @us/shared-types
          npm run build -w @us/schedule-validator
          npm run build -w @us/api
      - name: Instalar servicios Python y simulador AWS
        run: pip install -e services/validator -e services/optimizer -e services/worker "moto[server]>=5" requests pytest jsonschema
      - name: Pila completa (PostgreSQL + SQS/S3 simulados + API + worker)
        run: pytest tests/end-to-end -m e2e -v
