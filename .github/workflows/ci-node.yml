name: CI · Node
on:
  push:
    branches: [main]
  pull_request:
    paths: ["apps/**", "packages/**", "infrastructure/**", "package.json", "package-lock.json", "data/schemas/**", ".github/workflows/ci-node.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Worker Python para pruebas de integración API ↔ worker
        run: pip install -e services/validator -e services/optimizer -e services/worker
      - run: npm ci
      - name: Tipos de contratos al día
        run: |
          npm run generate -w @us/shared-types
          git diff --exit-code packages/shared-types/src/generated
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
